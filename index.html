<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Тетрадь</title>
<style>
:root{--bg:#f6f3ec;--card:#fff;--tx:#23201b;--mu:#7a7468;--ac:#2f6f5e;--on:#fff;--ln:#e3ddcf;--grid:#cfe0ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17181a;--card:#222426;--tx:#ecebe6;--mu:#9a978e;--ac:#6fc2a8;--on:#111;--ln:#34363a;--grid:#2f4357;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17181a;--card:#222426;--tx:#ecebe6;--mu:#9a978e;--ac:#6fc2a8;--on:#111;--ln:#34363a;--grid:#2f4357;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--ln)}
h1{font-size:20px;margin:0 4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h2{font-size:14px;color:var(--mu);margin:16px 14px 6px;font-weight:600}
main{padding-bottom:100px}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.mu{color:var(--mu);font-size:14px}.empty{text-align:center;margin-top:50px}
.x,.ic{border:0;background:none;color:var(--mu);font-size:18px;min-width:44px;min-height:44px}
.ic{color:var(--ac);font-size:32px}
.tabs{display:flex;gap:6px;margin:12px 14px}
.tabs button{flex:1;padding:11px 4px;border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
.tabs .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--ac);color:var(--on);font-size:32px;box-shadow:0 4px 14px #0004;z-index:12}
.ti{width:calc(100% - 28px);margin:12px 14px 4px;border:0;border-bottom:1px solid var(--ln);background:none;color:var(--tx);font:600 20px -apple-system,system-ui,sans-serif;padding:6px 0;outline:0}
.chk{display:flex;gap:8px;align-items:center;margin:8px 14px}
textarea{display:block;width:100%;border:0;outline:0;resize:none;color:var(--tx);background:var(--card);overflow:hidden}
.t{padding:14px;font:17px/1.5 -apple-system,system-ui,sans-serif;min-height:360px}
.sm{margin:0 14px;width:calc(100% - 28px);border:1px solid var(--ln);border-radius:12px;min-height:90px}
.g{width:calc(100% - 28px);margin:0 14px;min-height:360px;padding:0;font:18px/20px ui-monospace,Menlo,Consolas,monospace;letter-spacing:9.2px;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-attachment:local;white-space:pre-wrap;overflow-wrap:anywhere}
.sy,.tb{display:flex;gap:6px;padding:8px 14px}.sy{overflow-x:auto}.tb{flex-wrap:wrap}
.sy button,.tb button{min-width:40px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:17px -apple-system,system-ui,sans-serif;flex:none}
.tb .on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.ph{display:flex;gap:8px;overflow-x:auto;padding:8px 14px}.th{position:relative;flex:none}.th img{height:96px;border-radius:10px;display:block}
.th button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:26px;height:26px;background:#000a;color:#fff}
.add{flex:none;height:96px;padding:0 16px;border:1px dashed var(--mu);border-radius:10px;background:none;color:var(--ac);font:inherit}
.ms{width:100%;display:block;background:var(--card);touch-action:manipulation}
.ms line{stroke:var(--tx);stroke-width:1}.ms .f{fill:var(--tx);stroke:var(--tx)}.ms .o{fill:none;stroke:var(--tx);stroke-width:1.8}
.ms .st{stroke-width:1.5;fill:none}.ms text{fill:var(--tx);font-size:16px}.ms .cl{font-size:46px;font-family:"Noto Music","Apple Symbols","Segoe UI Symbol",serif}
#dlg{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;justify-content:center;z-index:30}
#dlg[hidden],#vw[hidden]{display:none}
.dc{background:var(--card);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.dc h3{margin:0 0 4px}
#di{width:100%;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:17px -apple-system,system-ui,sans-serif;margin:8px 0}
.ty{display:flex;gap:6px;margin:8px 0}.ty label{flex:1}.ty input{display:none}
.ty span{display:block;text-align:center;padding:10px 4px;border:1px solid var(--ln);border-radius:10px;font-size:14px}
.ty input:checked+span{background:var(--ac);color:var(--on);border-color:var(--ac)}
.br{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.b{padding:11px 18px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}
.b.p{background:var(--ac);color:var(--on);border-color:var(--ac)}.b.dn{background:#c0392b;color:#fff;border-color:#c0392b}
#vw{position:fixed;inset:0;background:#000e;z-index:40;display:flex;align-items:center;justify-content:center}#vw img{max-width:100%;max-height:100%}
html,body{overflow-x:hidden;max-width:100%;-webkit-text-size-adjust:100%}
main{max-width:820px;margin:0 auto}
header{padding-left:max(10px,calc((100% - 820px)/2));padding-right:max(10px,calc((100% - 820px)/2))}
img,svg,textarea,select,input{max-width:100%}h1{min-width:0}
.sm{font:16px/1.4 -apple-system,system-ui,sans-serif}
.ms .hl{fill:var(--ac);opacity:.2}#ms.dr svg.ms{touch-action:none}
.tb.ins{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:9;background:var(--bg)}
.tb.sb button{border-color:var(--ac);color:var(--ac)}
.fr{margin:10px 8px;border:1px solid var(--ln);border-radius:12px;overflow:hidden;background:var(--card)}
.fh{display:flex;justify-content:space-between;align-items:center;padding:2px 6px 2px 12px;color:var(--mu);font-size:13px}.fh button{border:0;background:none;color:var(--mu);font-size:16px;min-width:40px;min-height:36px}
.qw{display:grid;gap:4px;margin:8px 14px}.qi{position:relative}.qi img{width:100%;height:110px;object-fit:cover;border-radius:8px;display:block}.qi:only-child img{height:auto;max-height:70vh}
.qi button{position:absolute;top:3px;right:3px;border:0;border-radius:50%;width:26px;height:26px;background:#000a;color:#fff}
.fab{display:grid;place-items:center;padding:0 0 4px;line-height:1;font-size:34px;font-weight:300}
.t.mn,.g.mn{min-height:120px}
.pw{position:relative;margin:8px 14px}.pw img{width:100%;border-radius:10px;display:block}.pw button{position:absolute;top:6px;right:6px;border:0;border-radius:50%;width:30px;height:30px;background:#000a;color:#fff}
.tb select{height:40px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:16px -apple-system,system-ui,sans-serif;padding:0 8px;max-width:49%}
.ms .lb{font-size:13px;font-weight:600;text-anchor:middle}.ms .sg{fill:none;stroke:var(--tx);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.sgt{fill:none;stroke:currentColor;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
#dw{position:fixed;inset:0;background:#000b;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}#dw[hidden]{display:none}
#dc{background:var(--card);border-radius:14px;touch-action:none;width:min(86vw,300px);height:min(86vw,300px)}
</style></head><body>
<header id="hd"></header><main id="app"></main>
<button class="fab" id="fab">+</button><div id="dlg" hidden></div><div id="vw" hidden></div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const TY={text:'Обычный',grid:'В клетку',music:'Нотный'},SY=['²','³','√','½','π','∑','∫','∞','±','×','÷','=','≠','≤','≥','≈','→','(',')','[',']','^','_','α','β','Δ','°'];
let S={subs:[]},V={scr:'subs',tab:'lec'},T={dur:4,acc:'',er:0},db=null,tm,DCB=null;
const mk=(t,ty)=>({id:uid(),title:t||'Без названия',ty,tx:'',nt:[],ns:6,ph:[]});
function idb(){return new Promise((ok,no)=>{try{const r=indexedDB.open('tetrad',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no()}catch(e){no(e)}})}
async function load(){try{db=await idb();const v=await new Promise(ok=>{const q=db.transaction('kv').objectStore('kv').get('s');q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(null)});if(v)S=v}catch(e){}render()}
function save(){clearTimeout(tm);tm=setTimeout(()=>{try{db&&db.transaction('kv','readwrite').objectStore('kv').put(S,'s')}catch(e){}},400)}
const sub=()=>S.subs.find(x=>x.id===V.sid),H=()=>sub().hw.find(x=>x.id===V.id),SH=()=>V.scr==='lec'?sub().lec.find(x=>x.id===V.id):H().sh;
function musicSvg(s){const n=s.ns;let g='';
 for(let i=0;i<n;i++){const y=30+i*95;for(let k=0;k<5;k++)g+=`<line x1="8" x2="332" y1="${y+k*10}" y2="${y+k*10}"/>`;
  g+=`<line x1="8" x2="8" y1="${y}" y2="${y+40}"/><line x1="332" x2="332" y1="${y}" y2="${y+40}"/><text class="cl" x="12" y="${y+36}">𝄞</text>`}
 s.nt.forEach(o=>{const y=30+o.s*95,cx=o.x,cy=y+40-o.p*5,up=o.p<4,sx=up?cx+5.2:cx-5.2;
  for(let q=-2;q>=o.p;q-=2)g+=`<line x1="${cx-9}" x2="${cx+9}" y1="${y+40-q*5}" y2="${y+40-q*5}"/>`;
  for(let q=10;q<=o.p;q+=2)g+=`<line x1="${cx-9}" x2="${cx+9}" y1="${y+40-q*5}" y2="${y+40-q*5}"/>`;
  g+=`<ellipse cx="${cx}" cy="${cy}" rx="5.6" ry="4.2" transform="rotate(-20 ${cx} ${cy})" class="${o.d>=4?'f':'o'}"/>`;
  if(o.d>=2)g+=`<line class="st" x1="${sx}" x2="${sx}" y1="${cy}" y2="${up?cy-30:cy+30}"/>`;
  if(o.d===8)g+=up?`<path class="st" d="M${sx} ${cy-30}q9 6 5 17"/>`:`<path class="st" d="M${sx} ${cy+30}q9 -6 5 -17"/>`;
  if(o.a)g+=`<text x="${cx-17}" y="${cy+5}">${o.a}</text>`});
 return `<svg class="ms" viewBox="0 0 340 ${30+n*95}">${g}</svg>`}
function tapMs(e,sv){const r=sv.getBoundingClientRect(),k=340/r.width,x=(e.clientX-r.left)*k,y=(e.clientY-r.top)*k,s=SH();
 const i=Math.max(0,Math.min(s.ns-1,Math.round((y-50)/95))),p=Math.max(-4,Math.min(12,Math.round((70+i*95-y)/5))),nx=Math.max(44,Math.min(324,Math.round(x/10)*10));
 if(T.er){const j=s.nt.findIndex(o=>o.s===i&&Math.abs(o.x-x)<10&&Math.abs(o.p-p)<=1);if(j>=0)s.nt.splice(j,1)}
 else{s.nt=s.nt.filter(o=>!(o.s===i&&o.x===nx&&o.p===p));s.nt.push({s:i,x:nx,p,d:T.dur,a:T.acc})}
 $('#ms').innerHTML=musicSvg(s);save()}
function ed(s){
 if(s.ty==='text')return `<textarea class="t" data-f="tx" placeholder="Пишите здесь…">${esc(s.tx)}</textarea>`;
 if(s.ty==='grid')return `<div class="sy">${SY.map(c=>`<button data-a="sym" data-id="${c}">${c}</button>`).join('')}</div><textarea class="g" data-f="tx" spellcheck="false" placeholder="Один символ — одна клетка">${esc(s.tx)}</textarea>`;
 const b=(a,v,l,on)=>`<button class="${on?'on':''}" data-a="${a}" data-id="${v}">${l}</button>`;
 return `<div class="tb">${[[1,'Целая'],[2,'1/2'],[4,'1/4'],[8,'1/8']].map(d=>b('dur',d[0],d[1],T.dur==d[0])).join('')}</div><div class="tb">${b('acc','','без знака',!T.acc)}${b('acc','♯','♯',T.acc==='♯')}${b('acc','♭','♭',T.acc==='♭')}${b('er','',' Ластик',T.er)}${b('stv','','＋ стан',0)}</div><div id="ms">${musicSvg(s)}</div>`}
function render(){const sb=sub();let h='',t='Тетрадь',fab=1;
 if(V.scr==='subs')h=S.subs.length?S.subs.map(s=>`<div class="c row" data-a="open" data-id="${s.id}"><div><b>${esc(s.name)}</b><div class="mu">Лекций: ${s.lec.length} · Заданий: ${s.hw.length}</div></div><button class="x" data-a="delsub" data-id="${s.id}">✕</button></div>`).join(''):'<p class="mu empty">Добавьте первый предмет кнопкой «＋»</p>';
 else if(V.scr==='sub'){t=sb.name;const L=V.tab==='lec',li=L?sb.lec:sb.hw;
  h=`<div class="tabs"><button class="${L?'on':''}" data-a="tab" data-id="lec">Лекции</button><button class="${L?'':'on'}" data-a="tab" data-id="hw">Домашние задания</button></div>`+(li.length?li.map(x=>`<div class="c row" data-a="${L?'lec':'hwk'}" data-id="${x.id}"><div><b>${esc(x.title)}</b><div class="mu">${L?TY[x.ty]+(x.ph.length?' · фото: '+x.ph.length:''):(x.done?'✓ выполнено':'не выполнено')+' · '+TY[x.sh.ty]}</div></div><button class="x" data-a="del" data-id="${x.id}">✕</button></div>`).join(''):'<p class="mu empty">Пока пусто. Нажмите «＋»</p>')}
 else if(V.scr==='lec'){const s=SH();t=sb.name;fab=0;
  h=`<input class="ti" data-f="title" value="${esc(s.title)}"><div class="ph">${s.ph.map((p,i)=>`<div class="th"><img src="${p}" data-a="view" data-id="${i}"><button data-a="delph" data-id="${i}">✕</button></div>`).join('')}<button class="add" data-a="addph">＋ Фото</button></div>`+ed(s)}
 else{const o=H();t=sb.name;fab=0;
  h=`<input class="ti" data-o="h" data-f="title" value="${esc(o.title)}"><label class="chk"><input type="checkbox" data-o="h" data-f="done" ${o.done?'checked':''}> Выполнено</label><h2>Задание</h2><textarea class="sm" data-o="h" data-f="task" placeholder="Что нужно сделать">${esc(o.task)}</textarea><h2>Пояснение</h2><textarea class="sm" data-o="h" data-f="expl" placeholder="Пояснение, советы, ссылки">${esc(o.expl)}</textarea><h2>Выполненное задание</h2>`+ed(o.sh)}
 $('#hd').innerHTML=(V.scr==='subs'?'':'<button class="ic" data-a="back">‹</button>')+`<h1>${esc(t)}</h1>`;
 $('#app').innerHTML=h;$('#fab').style.display=fab?'':'none';fit()}
function fit(el){(el?[el]:document.querySelectorAll('textarea')).forEach(t=>{t.style.height='auto';t.style.height=Math.max(t.scrollHeight,t.classList.contains('sm')?90:360)+'px'})}
function dlg(t,o,cb){const d=$('#dlg');DCB=cb;
 d.innerHTML=`<div class="dc"><h3>${t}</h3>${o.msg?`<div class="mu">${o.msg}</div>`:''}${o.inp?`<input id="di" type="text" placeholder="${o.inp}" value="${esc(o.val||'')}" maxlength="80">`:''}${o.ty?`<div class="ty">${Object.keys(TY).map((k,i)=>`<label><input type="radio" name="ty" value="${k}" ${i?'':'checked'}><span>${TY[k]}</span></label>`).join('')}</div>`:''}<div class="br"><button class="b" data-a="dx">Отмена</button><button class="b p${o.dn?' dn':''}" data-a="dok">${o.ok||'Готово'}</button></div></div>`;
 d.hidden=false;if(o.inp)setTimeout(()=>$('#di').focus(),60)}
const ask=(t,msg,f)=>dlg(t,{msg,ok:'Удалить',dn:1},f);
function ph(f){return new Promise(ok=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};i.onerror=()=>ok(null);i.src=r.result};r.onerror=()=>ok(null);r.readAsDataURL(f)})}
document.addEventListener('click',e=>{
 const m=e.target.closest('svg.ms');if(m)return tapMs(e,m);
 if(e.target.closest('#vw')){$('#vw').hidden=true;return}
 const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a,id=el.dataset.id,sb=V.sid?sub():null;
 if(a==='open'){V={scr:'sub',sid:id,tab:'lec'};scrollTo(0,0)}
 else if(a==='back'){V=V.scr==='sub'?{scr:'subs',tab:'lec'}:{scr:'sub',sid:V.sid,tab:V.scr==='lec'?'lec':'hw'};scrollTo(0,0)}
 else if(a==='tab')V.tab=id;
 else if(a==='lec'||a==='hwk'){V={scr:a==='lec'?'lec':'hw',sid:V.sid,id,tab:V.tab};scrollTo(0,0)}
 else if(a==='delsub'){const s=S.subs.find(x=>x.id===id);return ask('Удалить предмет?',esc(s.name)+' и все записи в нём будут удалены.',()=>{S.subs=S.subs.filter(x=>x.id!==id);save();render()})}
 else if(a==='del'){const k=V.tab==='lec'?'lec':'hw';return ask('Удалить запись?','Это действие нельзя отменить.',()=>{sb[k]=sb[k].filter(x=>x.id!==id);save();render()})}
 else if(a==='dx'){$('#dlg').hidden=true;return}
 else if(a==='dok'){const v=($('#di')||{}).value||'',r=document.querySelector('input[name=ty]:checked'),f=DCB;$('#dlg').hidden=true;if(f)f(v.trim(),r?r.value:'text');return}
 else if(a==='sym'){const t=$('textarea.g'),p=t.selectionStart||0,q=t.selectionEnd||0;t.value=t.value.slice(0,p)+id+t.value.slice(q);SH().tx=t.value;t.focus();t.setSelectionRange(p+1,p+1);fit(t);save();return}
 else if(a==='dur'){T.dur=+id;render();return}
 else if(a==='acc'){T.acc=id;render();return}
 else if(a==='er'){T.er=T.er?0:1;render();return}
 else if(a==='stv'){SH().ns++;save()}
 else if(a==='addph'){$('#fi').click();return}
 else if(a==='view'){$('#vw').innerHTML=`<img src="${el.src}">`;$('#vw').hidden=false;return}
 else if(a==='delph'){SH().ph.splice(+id,1);save()}
 render()});
$('#fab').onclick=()=>{
 if(V.scr==='subs')dlg('Новый предмет',{inp:'Название предмета'},n=>{if(!n)return;S.subs.push({id:uid(),name:n,lec:[],hw:[]});save();render()});
 else if(V.tab==='lec')dlg('Новая лекция',{inp:'Тема лекции',ty:1,msg:'Выберите тип листка'},(n,ty)=>{const s=mk(n,ty);sub().lec.push(s);V={scr:'lec',sid:V.sid,id:s.id,tab:'lec'};save();render()});
 else dlg('Новое задание',{inp:'Название задания',ty:1,msg:'Тип листка для выполненного задания'},(n,ty)=>{const o={id:uid(),title:n||'Без названия',task:'',expl:'',done:false,sh:mk('',ty)};sub().hw.push(o);V={scr:'hw',sid:V.sid,id:o.id,tab:'hw'};save();render()})};
document.addEventListener('input',e=>{const t=e.target,f=t.dataset.f;if(!f)return;(t.dataset.o==='h'?H():SH())[f]=t.type==='checkbox'?t.checked:t.value;if(t.tagName==='TEXTAREA')fit(t);save()});
$('#fi').onchange=async e=>{const s=SH();for(const f of e.target.files){const d=await ph(f);if(d)s.ph.push(d)}e.target.value='';save();render()};
